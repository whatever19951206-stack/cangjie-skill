name: Cangjie quality gate

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "schemas/**"
      - "scripts/quality_gate.py"
      - "scripts/migrate_legacy_skill.py"
      - "scripts/evaluate_skill.py"
      - "scripts/cangjie.py"
      - "templates/**"
      - "methodology/**"
      - "docs/**"
      - "examples/**"
      - "tests/**"
      - "requirements-quality.txt"
      - ".github/workflows/quality-gate.yml"
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "schemas/**"
      - "scripts/quality_gate.py"
      - "scripts/migrate_legacy_skill.py"
      - "scripts/evaluate_skill.py"
      - "scripts/cangjie.py"
      - "templates/**"
      - "methodology/**"
      - "docs/**"
      - "examples/**"
      - "tests/**"
      - "requirements-quality.txt"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-quality.txt

      - name: Install quality dependencies
        run: python -m pip install -r requirements-quality.txt

      - name: Run all unit tests
        id: unit-tests
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_*.py' -v > /tmp/unit-tests.log 2>&1

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: /tmp/unit-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when unit tests fail
        if: steps.unit-tests.outcome == 'failure'
        run: |
          cat /tmp/unit-tests.log
          exit 1

      - name: Validate all machine-readable bundles
        run: python scripts/quality_gate.py --all

      - name: Run example baseline-vs-skill evaluation
        run: |
          python scripts/evaluate_skill.py \
            --cases examples/evaluation-harness/cases.jsonl \
            --results examples/evaluation-harness/results.jsonl \
            --output /tmp/cangjie-eval-report.json \
            --markdown-output /tmp/cangjie-eval-report.md \
            --minimum-uplift 0.5 \
            --fail-on-regression
